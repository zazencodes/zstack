# ── Extensions ───────────────────────────────────────────────────────────────

[[extensions]]
id = "agent-plane"
name = "Agent Plane"
repo = "zazencodes/tmux-agent-plane"
status = "available"
category = "Developer tools"
platforms = ["macos", "linux"]
pitch = "See and steer every coding agent running in your tmux, and let agents hand work to each other."
say_yes_if = "You run more than one agent at a time."
needs = ["tmux 3.3 or newer", "Rust and a C compiler, to build it"]
requires = []
guide = "extensions/agent-plane.md"

[[extensions]]
id = "snippets"
name = "Snippets"
repo = "zazencodes/snippets"
status = "available"
category = "Developer tools"
platforms = ["macos", "linux"]
pitch = "Save the instructions you keep retyping and add them to a message in a couple of keystrokes."
say_yes_if = "You type the same few instructions to your agent again and again."
needs = ["Claude Code, Codex, Pi or OpenCode"]
requires = []
guide = "extensions/snippets.md"

[[extensions]]
id = "koyomi"
name = "Koyomi"
repo = "zazencodes/koyomi"
status = "available"
category = "Productivity"
platforms = ["macos", "linux"]
pitch = "Run jobs on a schedule across your machines and get an email when one fails."
say_yes_if = "You want agents or scripts to run while you are not there."
needs = ["uv", "Python 3.10 or later"]
requires = []
guide = "extensions/koyomi.md"

[[extensions]]
id = "precise-en"
name = "precise//en"
repo = "zazencodes/precise-en"
status = "available"
category = "Productivity"
platforms = ["macos"]
pitch = "Learn the precise English words you could have used in your own prompts, with review on your Mac and iPhone."
say_yes_if = "You write long prompts and want a sharper vocabulary for them."
needs = ["macOS 15 or later", "Xcode and xcodegen", "An Apple developer account", "A Cloudflare account", "Node 22"]
requires = ["agent-plane"]
guide = "extensions/precise-en.md"

[[extensions]]
id = "swipe-list"
name = "Swipe List"
repo = "zazencodes/swipe-list"
status = "available"
category = "Creative"
platforms = ["macos", "linux"]
pitch = "Save design inspiration from your phone or Mac; your agent searches it whenever it designs something."
say_yes_if = "You screenshot or bookmark things you like and never find them again."
needs = ["A Linux server, a domain, Tailscale and a Neon account", "A Mac with Codex, Chrome, FFmpeg and Node.js 24 or later for the worker"]
requires = ["koyomi"]
guide = "extensions/swipe-list.md"
